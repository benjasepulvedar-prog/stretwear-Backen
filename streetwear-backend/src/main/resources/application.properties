spring.application.name=streetwear-backend

# Se conservan JPA y H2 como dependencias, sin iniciar conexiones ni repositorios JPA.
spring.autoconfigure.exclude=\
org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,\
org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration,\
org.springframework.boot.data.jpa.autoconfigure.DataJpaRepositoriesAutoConfiguration,\
org.springframework.boot.h2console.autoconfigure.H2ConsoleAutoConfiguration
spring.h2.console.enabled=false

# Los datos se guardan en colecciones Java y se pierden al detener la aplicación.

# Flyway queda incluido, pero no ejecuta migraciones.
spring.flyway.enabled=false
